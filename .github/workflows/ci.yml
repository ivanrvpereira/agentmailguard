name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"
  GOTOOLCHAIN: local

jobs:
  checks:
    name: Go (${{ matrix.go-version }})
    # Linux only: `make` on a Mac covers the macOS-only Keychain backend.
    # The repository variable LINUX_RUNNER can name a self-hosted runner. It runs pushes and pull requests from
    # branches of this repository only; pull requests from forks always run on a GitHub-hosted runner.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", stable]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Show toolchain
        run: |
          go version
          cc --version
          go env CGO_ENABLED GOOS GOARCH
      - name: Verify dependencies
        run: go mod verify
      - name: Format, vet, race tests, and build
        run: make
      - name: Check that go fix has nothing to change
        run: 'out="$(go fix -diff ./... 2>&1)" && test -z "$out" || { printf "%s\n" "$out"; exit 1; }'
      - name: Install pinned staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Staticcheck
        run: '"$(go env GOPATH)/bin/staticcheck" ./...'
      - name: Govulncheck
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  workflows:
    name: Workflow lint
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # actionlint runs shellcheck on every run: block. Scripts outside the workflows get their own check.
      - name: Lint workflows and release scripts
        run: |
          command -v shellcheck
          "$(go env GOPATH)/bin/actionlint"
          shellcheck scripts/release/*.sh

  secrets:
    name: Secret scan
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan complete fetched history
        run: '"$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --redact=100 --no-banner'
