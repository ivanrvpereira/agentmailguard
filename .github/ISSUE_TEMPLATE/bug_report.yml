name: Bug report
description: Something does not work as the docs describe.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        > **Public repository.** Do not include real company names, people's names, email addresses, account aliases, hostnames or IP addresses, folder IDs, or any mail or calendar content. Use made-up examples (`example.com`, Alice, Bob) and redact logs. GitHub keeps edits, so do not add this data and then delete it.
        >
        > Do not paste tokens, passwords, callback URLs, provider responses, or files from a daemon home. Use synthetic messages and the fake provider where you can. Report security problems privately: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands that you ran, with placeholders for addresses and IDs.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `amgd --version` and `amg --version`.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      multiple: true
      options:
        - Microsoft 365
        - Gmail
        - Fake provider
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5 (arm64), Ubuntu 24.04 (amd64)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Daemon log
      description: The relevant lines of the `amgd serve` output. The daemon log holds no mail content, but check it and redact it before you paste it.
      render: text
  - type: checkboxes
    id: public-data
    attributes:
      label: Public data
      options:
        - label: This issue contains no personal or company data.
          required: true
