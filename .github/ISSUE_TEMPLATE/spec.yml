name: Spec
description: A decided behavior, written so it can be implemented.
title: "Spec: "
body:
  - type: markdown
    attributes:
      value: |
        > **Public repository.** Do not include real company names, people's names, email addresses, account aliases, hostnames or IP addresses, folder IDs, or any mail or calendar content. Use made-up examples (`example.com`, Alice, Bob) and redact logs. GitHub keeps edits, so do not add this data and then delete it.
        >
        > A maintainer adds the `ready-for-agent` label when an agent should implement this. If the behavior is not decided yet, use the decision form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing today.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What the command, API, or screen should do. Say how Gmail and Microsoft 365 differ, if they do.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Implementation
      description: Decisions an implementer must follow.
  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: What a test should show. Use made-up data.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this spec does not change.
  - type: checkboxes
    id: public-data
    attributes:
      label: Public data
      options:
        - label: This issue contains no personal or company data.
          required: true
