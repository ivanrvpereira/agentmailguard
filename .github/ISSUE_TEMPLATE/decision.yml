name: Decision
description: A behavior that is not decided yet.
body:
  - type: markdown
    attributes:
      value: |
        > **Public repository.** Do not include real company names, people's names, email addresses, account aliases, hostnames or IP addresses, folder IDs, or any mail or calendar content. Use made-up examples (`example.com`, Alice, Bob) and redact logs. GitHub keeps edits, so do not add this data and then delete it.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The decision, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: The current behavior, with made-up examples.
  - type: textarea
    id: options
    attributes:
      label: Options
      description: The choices, and what each one would change.
    validations:
      required: true
  - type: checkboxes
    id: public-data
    attributes:
      label: Public data
      options:
        - label: This issue contains no personal or company data.
          required: true
